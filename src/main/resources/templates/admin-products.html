<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Products | Alvira Jewellery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #f4efe6;
            color: #3d2e1f;
        }
        h1, h2 { font-family: 'Playfair Display', serif; }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 230px;
            background: #2c2118;
            color: #ece3d4;
            padding: 28px 0;
            flex-shrink: 0;
        }
        .admin-sidebar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            padding: 0 24px 28px;
            display: block;
            text-decoration: none;
        }
        .admin-sidebar nav a {
            display: block;
            padding: 13px 24px;
            color: #cbbfa9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .admin-sidebar nav a:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .admin-sidebar nav a.active {
            background: rgba(181,138,75,0.15);
            color: #d9b877;
            border-left-color: #b58a4b;
            font-weight: 600;
        }
        .admin-sidebar .logout-link {
            display: block;
            margin-top: 40px;
            padding: 13px 24px;
            color: #e08585;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .admin-sidebar .logout-link:hover {
            background: rgba(224,133,133,0.1);
        }

        /* Main content */
        .admin-main {
            flex-grow: 1;
            padding: 36px 44px;
        }
        .admin-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .admin-topbar h1 {
            font-size: 26px;
            color: #2c2118;
            margin: 0;
        }
        .add-btn {
            background: #2c2118;
            color: white;
            padding: 11px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .add-btn:hover {
            background: #453423;
        }

        .admin-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(44,33,24,0.06);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 16px 20px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #f8f4ec;
            color: #6b543e;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #ece3d4;
        }
        tbody tr {
            border-bottom: 1px solid #f0ebe1;
            transition: background 0.15s ease;
        }
        tbody tr:hover {
            background: #fbf8f2;
        }
        tbody tr:last-child {
            border-bottom: none;
        }
        img.product-thumb {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 8px;
        }
        .actions a {
            margin-right: 14px;
            text-decoration: none;
            color: #b58a4b;
            font-weight: 600;
            font-size: 13px;
        }
        .actions .delete-link {
            color: #c05a5a;
        }
    </style>
</head>
<body>

<div class="admin-layout">

    <aside class="admin-sidebar">
        <a href="/admin" class="brand">Alvira Admin</a>
        <nav>
            <a href="/admin">Dashboard</a>
            <a href="/admin/products" class="active">Products</a>
            <a th:if="${currentAdminUser.hasPermission('orders')}" href="/admin/orders">Orders</a>
            <a th:if="${currentAdminUser.hasPermission('coupons')}" href="/admin/coupons">Coupons</a>
            <a th:if="${currentAdminUser.hasPermission('offers')}" href="/admin/offers">Offers</a>
            <a th:if="${currentAdminUser.hasPermission('orders')}" href="/admin/returns">Returns</a>
            <a th:if="${currentAdminUser.hasPermission('reports')}" href="/admin/reports">Reports</a>
            <a th:if="${currentAdminUser.hasPermission('logistics')}" href="/admin/logistics">Logistics</a>
            <a th:if="${currentAdminUser.hasPermission('orders')}" href="/admin/abandoned-carts">Abandoned Carts</a>
            <a th:if="${currentAdminUser.hasPermission('customers')}" href="/admin/customers">Customers</a>
            <a th:if="${currentAdminUser.role == 'ADMIN'}" href="/admin/staff">Staff Accounts</a>
            <a th:if="${currentAdminUser.role == 'ADMIN'}" href="/admin/activity-log">Activity Log</a>
        </nav>
        <a href="/logout" class="logout-link">Logout</a>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <h1>Manage Products</h1>
            <a href="/admin/products/new" class="add-btn">+ Add New Product</a>
        </div>

        <div class="admin-card">
            <table>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                <tr th:each="product : ${products}">
                    <td><img class="product-thumb" th:src="${product.imageUrl}" alt="Product"/></td>
                    <td th:text="${product.name}">Name</td>
                    <td th:text="'₹' + ${product.price}">₹0</td>
                    <td th:text="${product.description}">Description</td>
                    <td th:text="${#temporals.format(product.createdAt, 'dd MMM yyyy')}">Date</td>
                    <td class="actions">
                        <a th:href="@{'/admin/products/edit/' + ${product.id}}">Edit</a>
                        <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="delete-link" onclick="return confirm('Delete this product?')">Delete</a>
                    </td>
                </tr>
            </table>
        </div>
    </main>

</div>

</body>
</html>
