<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Returns | Alvira Jewellery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #fdf6ec; color: #3d2e1f; }
        h1 { font-family: 'Playfair Display', serif; text-align: center; color: #4a3627; margin: 40px 0 10px; }
        .subtitle { text-align: center; color: #8a6a44; font-size: 14px; margin-bottom: 40px; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        nav .logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: #5a4632; text-decoration: none; }
        nav a.link { text-decoration: none; color: #5a4632; margin-left: 20px; }

        .container { max-width: 700px; margin: 0 auto; padding: 0 20px 60px; }

        .order-card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(90,70,50,0.06); }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .order-id { font-weight: 700; color: #4a3627; }
        .order-items { color: #6b543e; font-size: 14px; margin: 8px 0; }
        .order-date { color: #a3927e; font-size: 12px; }

        .eligible-note { color: #2e7d32; font-size: 13px; font-weight: 600; margin-top: 10px; }
        .expired-note { color: #a3927e; font-size: 13px; font-weight: 600; margin-top: 10px; }

        .return-btn { display: inline-block; margin-top: 12px; padding: 9px 20px; background: #5a4632; color: white; text-decoration: none; border-radius: 30px; font-size: 13px; font-weight: 600; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; color: white; display: inline-block; margin-top: 10px; }
        .status-REQUESTED { background: #d99a3f; }
        .status-APPROVED { background: #4a7ab5; }
        .status-REJECTED { background: #c05a5a; }
        .status-REFUNDED { background: #4f9e5f; }

        .empty-state { text-align: center; color: #8a6a44; padding: 60px 20px; background: white; border-radius: 16px; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">Alvira Jewellery</a>
    <div>
        <a href="/store" class="link">Shop</a>
        <a href="/account" class="link">My Account</a>
    </div>
</nav>

<h1>My Returns</h1>
<p class="subtitle">Returns are accepted within 7 days of delivery</p>

<div class="container">

    <div th:if="${orders.size() == 0}" class="empty-state">
        You don't have any delivered orders yet.
    </div>

    <div class="order-card" th:each="order : ${orders}">
        <div class="order-header">
            <span class="order-id" th:text="'Order #' + ${order.id}">Order #0</span>
        </div>
        <div class="order-items" th:text="${order.orderSummary}">Items</div>
        <div class="order-date" th:text="'Delivered: ' + ${#temporals.format(order.deliveredDate, 'dd MMM yyyy')}">Delivered date</div>

        <!-- Already has a return request -->
        <div th:with="existing=${returnsByOrderId.get(order.id)}">
            <div th:if="${existing != null}">
                <span class="status-badge" th:classappend="'status-' + ${existing.status}" th:text="'Return ' + ${existing.status}">Status</span>
            </div>
            <div th:if="${existing == null}">
                <div th:if="${order.deliveredDate != null and order.deliveredDate.isAfter(now.minusDays(7))}">
                    <div class="eligible-note">✓ Eligible for return</div>
                    <a th:href="@{'/returns/initiate/' + ${order.id}}" class="return-btn">Initiate Return</a>
                </div>
                <div th:if="${order.deliveredDate == null or !order.deliveredDate.isAfter(now.minusDays(7))}" class="expired-note">
                    Return window has expired (7 days from delivery)
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
