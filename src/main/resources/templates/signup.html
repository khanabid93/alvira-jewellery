<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Alvira Jewellery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf6ec 0%, #f3e4d0 40%, #e8d3b0 100%);
            margin: 0; min-height: 100vh; color: #3d2e1f;
            display: flex; align-items: center; justify-content: center; padding: 30px;
        }
        h1 { font-family: 'Playfair Display', serif; text-align: center; color: #4a3627; }
        .auth-box {
            background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.7); border-radius: 20px; box-shadow: 0 8px 32px rgba(90,70,50,0.12);
            padding: 36px; max-width: 400px; width: 100%;
        }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; color: #4a3627; }
        input {
            width: 100%; padding: 11px 14px; margin-top: 6px;
            border: 1px solid rgba(90,70,50,0.2); border-radius: 10px; background: rgba(255,255,255,0.6);
            font-family: 'Inter', sans-serif;
        }
        .submit-btn {
            display: block; width: 100%; margin-top: 22px; padding: 13px;
            background: rgba(90,70,50,0.9); color: white; border: none; border-radius: 30px;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .error-msg { color: #c62828; font-size: 14px; margin-top: 10px; text-align: center; }
        .switch-link { text-align: center; margin-top: 18px; font-size: 14px; color: #6b543e; }
        .switch-link a { color: #a8791a; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-box">
    <h1>Create Account</h1>

    <div class="error-msg" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/signup}" method="post">
        <label>Full Name</label>
        <input type="text" name="fullName" required/>

        <label>Email</label>
        <input type="email" name="email" required/>

        <label>Phone Number</label>
        <input type="text" name="phoneNumber" required/>

        <label>Password</label>
        <input type="password" name="password" required/>

        <button type="submit" class="submit-btn">Sign Up</button>
    </form>

    <div class="switch-link">Already have an account? <a href="/login">Log In</a></div>
</div>

</body>
</html>
