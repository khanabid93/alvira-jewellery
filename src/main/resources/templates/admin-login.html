<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Alvira Jewellery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 36px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 100%;
        }
        h1 { color: #333; font-size: 22px; text-align: center; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 10px; margin-top: 6px;
            border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        button {
            display: block; width: 100%; margin-top: 20px; padding: 12px;
            background: #5a4632; color: white; border: none; border-radius: 6px;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #c62828; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Admin / Staff Login</h1>
    <p style="text-align:center; color:#8a6a44; font-size:13px; margin-top:-10px;">For store administrators and staff members</p>

    <div class="error-msg" th:if="${param.error}">Invalid username or password.</div>

    <form th:action="@{/admin-login}" method="post">
        <label>Username</label>
        <input type="text" name="username" required/>

        <label>Password</label>
        <input type="password" name="password" required/>

        <button type="submit">Log In</button>
    </form>

    <div style="text-align:center; margin-top:16px; font-size:13px; color:#8a6a44;">
        Are you a customer? <a href="/login" style="color:#5a4632; font-weight:600;">Log in here</a>
    </div>
</div>

</body>
</html>
